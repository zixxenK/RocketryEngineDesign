[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-analysis-toolkit"
version = "0.1.0"
description = "Unit-aware rocket propulsion analysis and RPA4/CFD result comparison tools"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cea>=3.3.4",
  "cantera",
  "fluids",
  "matplotlib",
  "meshio",
  "numpy",
  "openmdao>=3.45",
  "optuna>=5.0",
  "pandas",
  "pdfplumber",
  "pint",
  "pyvista",
  "scipy",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8", "pyqtgraph>=0.13.7", "watchdog>=6.0"]
dev = ["pytest", "pytest-qt", "hypothesis"]

[project.scripts]
rocket-study = "rocket_analysis.cli:main"
rocket-study-desktop = "rocket_analysis.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "requires_cea: requires the NASA CEA package and its data files",
  "requires_cantera: requires Cantera and a configured mechanism",
]
